<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Photo Planet · Sado</title>
    <meta name="description" content="Những hành tinh nhỏ từ những chuyến đi — khám phá và xem ảnh chụp ở từng nơi." />
    <meta name="theme-color" content="#63c2bd" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%2363c2bd' stroke='%2324383c' stroke-width='4'/%3E%3Cpath d='M14 30c8-6 14 4 22-2s12 2 14 6' fill='none' stroke='%2324383c' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='42' r='5' fill='%237cbc62' stroke='%2324383c' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&family=Zen+Maru+Gothic:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <!-- Loader + màn hình mở đầu -->
    <section id="intro" class="intro">
      <div class="intro-card">
        <div class="brand">PHOTO&nbsp;PLANET</div>
        <h1 class="intro-title"><span id="intro-name">Sado</span><small id="intro-jp">佐渡島</small></h1>
        <div class="intro-meta" id="intro-meta"></div>
        <p class="intro-text" id="intro-text"></p>
        <button id="start" class="btn-main" disabled>
          <span class="spinner" aria-hidden="true"></span><span class="label">Đang dựng hành tinh…</span>
        </button>
        <div class="intro-hint">Kéo để xoay · Cuộn / chụm để phóng to · Chạm để đi</div>
      </div>
    </section>

    <!-- HUD -->
    <header class="hud-top" id="hud-top">
      <button class="trip-chip" id="trip-chip" title="Nhật ký hành trình">
        <span class="trip-jp" id="trip-jp">佐渡島</span>
        <span class="trip-name" id="trip-name">Sado</span>
        <span class="trip-progress" id="trip-progress">0/6</span>
      </button>
    </header>

    <nav class="hud-right" id="hud-right">
      <button class="btn-ico" id="btn-map" title="Toàn cảnh hành tinh (M)" aria-label="Toàn cảnh hành tinh">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M4 10.5c3-2 5 1.5 8-.5s5-1 8 .8M6 17c2-1.5 4 .2 6-1s4-.4 6 .5" /></svg>
      </button>
      <button class="btn-ico" id="btn-journal" title="Nhật ký hành trình (J)" aria-label="Nhật ký hành trình">
        <svg viewBox="0 0 24 24"><path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z" /><path d="M5 16.5a3 3 0 0 1 3-3h11M9 8h6M9 11h4" /></svg>
      </button>
      <button class="btn-ico" id="btn-music" title="Âm thanh" aria-label="Bật/tắt âm thanh">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></svg>
      </button>
      <button class="btn-ico" id="btn-full" title="Toàn màn hình" aria-label="Toàn màn hình">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
    </nav>

    <div class="place-title" id="place-title" aria-live="polite">
      <div class="pt-name" id="pt-name"></div>
      <div class="pt-jp" id="pt-jp"></div>
    </div>

    <button class="prompt" id="prompt" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
      <span>Xem ảnh</span><kbd>E</kbd>
    </button>

    <div class="joystick" id="joystick" aria-hidden="true">
      <div class="ring"><i></i><i></i><i></i><i></i></div>
      <div class="knob"></div>
    </div>
    <div class="pins" id="pins"></div>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast"></div>
    <div class="flash" id="flash"></div>

    <!-- Album ảnh -->
    <section class="gallery" id="gallery" hidden aria-modal="true" role="dialog">
      <div class="g-card">
        <button class="g-close" id="g-close" aria-label="Đóng">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
        <div class="g-stage" id="g-stage">
          <div class="g-print">
            <div class="g-frame" id="g-frame">
              <img class="g-img g-thumb" id="g-thumb" alt="" />
              <img class="g-img g-full" id="g-full" alt="" />
            </div>
          </div>
          <button class="g-nav g-prev" id="g-prev" aria-label="Ảnh trước"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>
          <button class="g-nav g-next" id="g-next" aria-label="Ảnh sau"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></button>
        </div>
        <aside class="g-info">
          <div class="g-chapter" id="g-chapter"></div>
          <h2 class="g-title" id="g-title"></h2>
          <div class="g-jp" id="g-jp"></div>
          <p class="g-caption" id="g-caption"></p>
          <p class="g-blurb" id="g-blurb"></p>
          <dl class="g-exif" id="g-exif"></dl>
          <div class="g-strip" id="g-strip"></div>
        </aside>
        <div class="stamp" id="stamp">ĐÃ KHÁM PHÁ</div>
      </div>
    </section>

    <!-- Nhật ký -->
    <aside class="journal" id="journal" hidden>
      <div class="j-head">
        <div>
          <div class="j-kicker">Nhật ký hành trình</div>
          <h3 class="j-title" id="j-title"></h3>
        </div>
        <button class="g-close j-close" id="j-close" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      </div>
      <div class="j-bar"><span id="j-bar"></span></div>
      <ol class="j-list" id="j-list"></ol>
      <p class="j-foot">Chạm vào một nơi để bay tới đó.</p>
      <div class="j-planets" id="j-planets" hidden>
        <div class="j-kicker">Hành tinh khác</div>
        <div class="j-plist"></div>
      </div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
